services:
  - type: web
    name: affiliateflow
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FB_PIXEL_ID
        value: "1390288544176312"
      - key: USD_TO_XOF
        value: "600"
