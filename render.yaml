services:
  - type: web
    name: affiliateflow
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DB_PATH
        value: /data/affiliateflow.db
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
